<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#fbf3ec;font-family:Georgia,"Times New Roman",serif}
  .card{position:absolute;left:52px;top:52px;width:1096px;height:526px;box-sizing:border-box;
    background:#fff;border:2px solid #808080;border-top:12px solid #e7651a;border-radius:0 0 16px 16px}
  h1{position:absolute;left:46px;top:68px;margin:0;font-size:64px;font-weight:700;color:#111}
  .url{position:absolute;left:50px;top:176px;font-family:"Courier New",monospace;font-size:26px;color:#990000}
  .tag{position:absolute;left:46px;top:270px;font-size:34px;color:#333}
  .cmd{position:absolute;left:46px;top:416px;font-family:"Courier New",monospace;font-size:26px;color:#8a8a8a}
  svg{position:absolute;right:40px;top:58px}
</style></head>
<body>
<div class="card">
  <h1>Sightings</h1>
  <div class="url">https://sightings.indrayam.com</div>
  <div class="tag">Tech worth a second look.</div>
  <div class="cmd">&gt; tail -f /var/log/sightings.log</div>
  <svg width="360" height="360" viewBox="0 0 360 360" aria-hidden="true">
    <defs>
      <radialGradient id="sweep" cx="180" cy="180" r="170" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#e7651a" stop-opacity="0.28"/>

      </radialGradient>
    </defs>
    <g fill="none" stroke="#e7651a" stroke-opacity="0.35" stroke-width="2">
      <circle cx="180" cy="180" r="168"/>
      <circle cx="180" cy="180" r="118"/>
      <circle cx="180" cy="180" r="68"/>
      <path d="M180 12V348M12 180H348" stroke-opacity="0.18"/>
    </g>
    <path d="M180 180 L180 12 A168 168 0 0 1 325.5 96 Z" fill="url(#sweep)"/>
    <line x1="180" y1="180" x2="325.5" y2="96" stroke="#e7651a" stroke-width="3"/>
    <circle cx="180" cy="180" r="6" fill="#bf5213"/>
    <circle cx="238" cy="78" r="9" fill="#e7651a"/>
    <circle cx="238" cy="78" r="18" fill="#e7651a" fill-opacity="0.18"/>
    <circle cx="96" cy="236" r="7" fill="#b42318" fill-opacity="0.8"/>
    <circle cx="262" cy="268" r="6" fill="#ca8a04" fill-opacity="0.85"/>
    <circle cx="120" cy="110" r="5" fill="#c2410c" fill-opacity="0.6"/>
  </svg>
</div>
</body></html>
